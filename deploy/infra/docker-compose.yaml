version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: boring-neighbor-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: boring_neighbor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - boring-neighbor-net

  minio:
    image: minio/minio:latest
    container_name: boring-neighbor-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - boring-neighbor-net

networks:
  boring-neighbor-net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
